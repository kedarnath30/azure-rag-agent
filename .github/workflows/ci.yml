name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAG_BACKEND: local  # CI is fully offline: no Azure keys or network calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Eval
        run: |
          ragagent eval --out reports/eval_results.json --min-hit-at-5 0.9
          ragagent eval --golden data/eval/golden_paraphrase.jsonl --out reports/eval_paraphrase.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t azure-rag-agent:ci .
