[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-rag-agent"
version = "0.1.0"
description = "RAG + tool-using agent over HR policy docs, with offline and Azure backends."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kedarnath Pandiri" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
azure = ["openai>=1.30", "azure-search-documents>=11.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ragagent = "ragagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
